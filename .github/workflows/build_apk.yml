name: Build RoboScrap 3.5 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Gerar estrutura Android
        run: flutter create --platforms=android --org com.chiavegatti.roboscrap .
      - name: Baixar pacotes
        run: flutter pub get
      - name: Compilar APK Release
        run: flutter build apk --release
      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: roboscrap_v35
          path: build/app/outputs/flutter-apk/app-release.apk
