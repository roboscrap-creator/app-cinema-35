name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Criar estrutura Android, embutir TorrServer e gerar logo Cinema
        run: |
          flutter create . --platforms=android --org com.chiavegatti.cinema
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/><application android:usesCleartextTraffic="true"|' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="app_cinema"/android:label="Cinema"/' android/app/src/main/AndroidManifest.xml

          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/android {/android {\n    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/android {/android {\n    packagingOptions {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }/' android/app/build.gradle
          fi

          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          curl -fsSL -o android/app/src/main/jniLibs/arm64-v8a/libtorrserver.so \
            https://github.com/YouROK/TorrServer/releases/latest/download/TorrServer-android-arm64
          curl -fsSL -o android/app/src/main/jniLibs/armeabi-v7a/libtorrserver.so \
            https://github.com/YouROK/TorrServer/releases/latest/download/TorrServer-android-arm7
          chmod +x android/app/src/main/jniLibs/arm64-v8a/libtorrserver.so
          chmod +x android/app/src/main/jniLibs/armeabi-v7a/libtorrserver.so

          MAIN_ACT=$(find android/app/src/main -name "MainActivity.kt" | head -n 1)
          PKG_LINE=$(grep "^package " "$MAIN_ACT" | head -n 1)
          {
            echo "$PKG_LINE"
            echo ""
            echo "import io.flutter.embedding.android.FlutterActivity"
            echo "import io.flutter.embedding.engine.FlutterEngine"
            echo "import io.flutter.plugin.common.MethodChannel"
            echo ""
            echo "class MainActivity: FlutterActivity() {"
            echo "    private val CHANNEL = \"com.chiavegatti.cinema/torrserver\""
            echo ""
            echo "    override fun configureFlutterEngine(flutterEngine: FlutterEngine) {"
            echo "        super.configureFlutterEngine(flutterEngine)"
            echo "        MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->"
            echo "            if (call.method == \"getPaths\") {"
            echo "                val paths = mapOf("
            echo "                    \"nativeLibDir\" to applicationContext.applicationInfo.nativeLibraryDir,"
            echo "                    \"filesDir\" to applicationContext.filesDir.absolutePath"
            echo "                )"
            echo "                result.success(paths)"
            echo "            } else {"
            echo "                result.notImplemented()"
            echo "            }"
            echo "        }"
            echo "    }"
            echo "}"
          } > "$MAIN_ACT"

          python3 -m pip install pillow
          python3 gerar_icone.py
      - name: Instalar dependencias
        run: flutter pub get
      - name: Compilar APK Release
        run: |
          flutter build apk --config-only --release
          cd android && ./gradlew assembleRelease -x lintVitalAnalyzeRelease -x lintVitalRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-cinema-release
          path: build/app/outputs/flutter-apk/app-release.apk
